<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SANDER UNITE: Estação Paulista - 16-Bit</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; -webkit-touch-callout: none; user-select: none; }
    body {
      background: #0a0712;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #hud {
      width: 100%;
      max-width: 520px;
      background: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      font-size: 8px;
      border-bottom: 3px solid #ffcc00;
      z-index: 10;
    }
    .hud-card { display: flex; align-items: center; gap: 4px; }
    .btn-hud {
      background: #222;
      border: 2px solid #555;
      color: #fff;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 8px;
      cursor: pointer;
    }
    #canvas-container {
      width: 100%;
      max-width: 520px;
      position: relative;
      background: #000;
      display: flex;
      justify-content: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #1c3619;
      image-rendering: pixelated;
    }
    #overlay-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 7, 18, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 20;
    }
    .intro-logo-box {
      border: 3px solid #ff0055;
      background: #1a092b;
      padding: 10px 16px;
      margin-bottom: 15px;
      box-shadow: 0 0 10px #ff0055;
    }
    .game-title { color: #00ffff; font-size: 14px; margin-bottom: 6px; }
    .game-sub { color: #ffcc00; font-size: 8px; }
    #welcome-text { font-size: 7px; color: #ddd; line-height: 1.6; margin-bottom: 18px; max-width: 380px; }
    .btn-main {
      background: #ff0055;
      border: 3px solid #fff;
      color: #fff;
      padding: 10px 24px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 4px #88002e;
    }
    #touch-zone {
      width: 100%;
      max-width: 520px;
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
      background: #0e0a1a;
      border-top: 3px solid #1a2920;
    }
    .dpad-disk {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      display: grid;
      grid-template-columns: 38px 38px 38px;
      grid-template-rows: 38px 38px 38px;
      gap: 3px;
    }
    .btn-dpad {
      background: #1b261f;
      border: 2px solid #385940;
      color: #ffcc00;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .btn-dpad:active { background: #ffcc00; color: #000; }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }
    .btn-action {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ff0055;
      border: 4px solid #fff;
      color: #fff;
      font-family: inherit;
      font-size: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
    }
    .btn-action:active { transform: scale(0.95); background: #00ffff; color: #000; }
  </style>
</head>
<body>

  <div id="hud">
    <div class="hud-card">FASE: <span id="h-stage" style="color:#00ffff;">1/3</span></div>
    <div class="hud-card">VIDAS: <span id="h-lives" style="color:#ff0055;">❤️❤️</span></div>
    <button class="btn-hud" id="btn-pause">PAUSE</button>
    <div class="hud-card" id="h-time" style="color:#ffcc00;">02:00</div>
    <div class="hud-card"><span id="h-energy" style="color:#39ff14;">0</span>/1000</div>
  </div>

  <div id="canvas-container">
    <div id="overlay-screen">
      <div class="intro-logo-box">
        <div class="game-title">SANDER UNITE</div>
        <div class="game-sub">ESTAÇÃO PAULISTA: 16-BIT RETRO</div>
      </div>
      <div id="welcome-text">
        Guie Sander pelo circuito do parque, absorva energia dos caminhantes até somar 1000 pontos e use a Poção de Gelo para congelar a Bruxa Alada!
      </div>
      <button class="btn-main" id="start-btn">INICIAR</button>
    </div>
    <canvas id="gameCanvas" width="480" height="300"></canvas>
  </div>

  <div id="touch-zone">
    <div class="dpad-disk">
      <div class="btn-dpad" id="btn-up">▲</div>
      <div class="btn-dpad" id="btn-left">◀</div>
      <div class="btn-dpad" id="btn-right">▶</div>
      <div class="btn-dpad" id="btn-down">▼</div>
    </div>
    <button class="btn-action" id="b-absorb">
      <span>CONGELAR</span>
      <span style="font-size: 5px; color: #ffcc00;">PODER</span>
    </button>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Imagen del mapa pixel-art
const mapImg = new Image();
mapImg.src = 'mapa.png'; // Si subes tu imagen con nombre mapa.png al repo se mostrará directamente

let gameState = 'intro';
let currentStage = 1;
const totalStages = 3;
let score = 0;
const targetScore = 1000;
let roundTime = 120;
let lives = 2;
let timerInterval = null;

const sander = {
  x: 45, y: 55,
  w: 16, h: 22,
  speed: 2.2,
  hasPotion: true,
  freezeTimer: 0
};

const boss = {
  x: 240, y: 150,
  w: 22, h: 24,
  speed: 0.85
};

let walkers = [];
const keys = { up: false, down: false, left: false, right: false };

function initWalkers() {
  walkers = [];
  for (let i = 0; i < 10; i++) {
    walkers.push({
      x: 60 + Math.random() * 360,
      y: 40 + Math.random() * 220,
      w: 8, h: 14,
      vx: (Math.random() - 0.5) * 1.2,
      vy: (Math.random() - 0.5) * 1.2,
      color: ['#ff77a8', '#00e436', '#29adff', '#ffec27', '#ffa300'][i % 5]
    });
  }
}

// Dibujado del mapa estilo Estação Paulista
function drawMap() {
  if (mapImg.complete && mapImg.naturalWidth !== 0) {
    ctx.drawImage(mapImg, 0, 0, canvas.width, canvas.height);
    return;
  }

  // Respaldo visual idéntico al mapa original
  ctx.fillStyle = '#2d5a27';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Senderos de tierra
  ctx.fillStyle = '#dfb15b';
  ctx.fillRect(25, 45, 90, 24);
  ctx.fillRect(95, 45, 26, 170);
  ctx.fillRect(95, 190, 310, 24);
  ctx.fillRect(380, 75, 26, 140);
  ctx.fillRect(220, 75, 185, 24);
  ctx.fillRect(220, 75, 24, 130);

  // Lago decorativo
  ctx.fillStyle = '#1c6ca1';
  ctx.fillRect(265, 115, 75, 45);
  ctx.strokeStyle = '#4da6ff';
  ctx.lineWidth = 2;
  ctx.strokeRect(265, 115, 75, 45);

  // Estación Paulista
  ctx.fillStyle = '#34495e';
  ctx.fillRect(170, 8, 140, 32);
  ctx.fillStyle = '#1a252f';
  ctx.fillRect(175, 12, 130, 24);
  ctx.fillStyle = '#fff';
  ctx.font = '6px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('ESTAÇÃO PAULISTA', 240, 27);

  // Banderas INÍCIO / FIM
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(30, 35, 14, 10);
  ctx.fillStyle = '#29adff';
  ctx.fillRect(405, 205, 14, 10);
}

function drawSander(x, y) {
  // Sombra
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(x + 2, y + 19, 12, 4);

  // Abrigo azul
  ctx.fillStyle = '#1a53ff';
  ctx.fillRect(x + 2, y + 7, 12, 9);
  ctx.fillStyle = '#00ffff';
  ctx.fillRect(x + 5, y + 9, 6, 5); // Estampa Sander

  // Rostro y barba
  ctx.fillStyle = '#c68642';
  ctx.fillRect(x + 4, y + 2, 8, 6);
  ctx.fillStyle = '#111';
  ctx.fillRect(x + 4, y + 6, 8, 2); // Barba

  // Cabello y audífonos azules
  ctx.fillStyle = '#111';
  ctx.fillRect(x + 3, y, 10, 3);
  ctx.fillStyle = '#00ffff';
  ctx.fillRect(x + 2, y + 2, 2, 4);
  ctx.fillRect(x + 12, y + 2, 2, 4);

  // Bermudas y zapatillas
  ctx.fillStyle = '#1c1c1c';
  ctx.fillRect(x + 3, y + 15, 10, 4);
  ctx.fillStyle = '#ff0055';
  ctx.fillRect(x + 2, y + 19, 4, 3);
  ctx.fillRect(x + 10, y + 19, 4, 3);
}

function drawBoss(x, y) {
  ctx.fillStyle = sander.freezeTimer > 0 ? '#00ffff' : '#ff0055';
  // Alas mecha
  ctx.fillRect(x - 6, y + 2, 6, 12);
  ctx.fillRect(x + 22, y + 2, 6, 12);
  // Cuerpo y armadura
  ctx.fillStyle = '#4a0e4e';
  ctx.fillRect(x, y, 22, 22);
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(x + 4, y + 4, 14, 6); // Corona/Visor
}

function updateHUD() {
  document.getElementById('h-stage').innerText = `${currentStage}/${totalStages}`;
  document.getElementById('h-lives').innerText = '❤️'.repeat(Math.max(0, lives));
  const m = Math.floor(roundTime / 60).toString().padStart(2, '0');
  const s = (roundTime % 60).toString().padStart(2, '0');
  document.getElementById('h-time').innerText = `${m}:${s}`;
  document.getElementById('h-energy').innerText = score;
}

function update() {
  if (gameState !== 'playing') return;

  // Movimiento Sander
  if (keys.up && sander.y > 10) sander.y -= sander.speed;
  if (keys.down && sander.y < canvas.height - sander.h - 10) sander.y += sander.speed;
  if (keys.left && sander.x > 10) sander.x -= sander.speed;
  if (keys.right && sander.x < canvas.width - sander.w - 10) sander.x += sander.speed;

  // Movimiento Caminantes
  walkers.forEach(w => {
    w.x += w.vx;
    w.y += w.vy;
    if (w.x < 20 || w.x > canvas.width - 30) w.vx *= -1;
    if (w.y < 20 || w.y > canvas.height - 30) w.vy *= -1;

    // Absorber energía
    if (Math.hypot((sander.x + 8) - w.x, (sander.y + 11) - w.y) < 18) {
      score += 2;
      if (score >= targetScore) {
        if (currentStage < totalStages) {
          currentStage++;
          score = 0;
          roundTime = 120;
          sander.x = 45; sander.y = 55;
        } else {
          gameState = 'win';
          alert('¡VICTORIA TOTAL! Has completado las 3 fases del parque.');
        }
      }
      updateHUD();
    }
  });

  // Bruxa Alada persiguiendo
  if (sander.freezeTimer > 0) {
    sander.freezeTimer--;
  } else {
    const angle = Math.atan2((sander.y) - boss.y, (sander.x) - boss.x);
    boss.x += Math.cos(angle) * boss.speed;
    boss.y += Math.sin(angle) * boss.speed;

    if (Math.hypot(sander.x - boss.x, sander.y - boss.y) < 16) {
      lives--;
      updateHUD();
      sander.x = 45; sander.y = 55;
      boss.x = 240; boss.y = 150;
      if (lives <= 0) {
        gameState = 'over';
        document.getElementById('overlay-screen').style.display = 'flex';
        document.getElementById('welcome-text').innerText = 'FIM DE JOGO! A Bruxa alcançou Sander ou a energia esgotou.';
        document.getElementById('start-btn').innerText = 'REPETIR';
      }
    }
  }
}

function draw() {
  drawMap();

  // Caminantes
  walkers.forEach(w => {
    ctx.fillStyle = w.color;
    ctx.fillRect(w.x, w.y, w.w, w.h);
  });

  drawBoss(boss.x, boss.y);
  drawSander(sander.x, sander.y);

  if (sander.freezeTimer > 0) {
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(boss.x - 2, boss.y - 2, boss.w + 4, boss.h + 4);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  document.getElementById('overlay-screen').style.display = 'none';
  gameState = 'playing';
  score = 0;
  lives = 2;
  roundTime = 120;
  sander.x = 45; sander.y = 55;
  initWalkers();
  updateHUD();

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (gameState === 'playing') {
      roundTime--;
      updateHUD();
      if (roundTime <= 0) {
        gameState = 'over';
        document.getElementById('overlay-screen').style.display = 'flex';
        document.getElementById('welcome-text').innerText = 'TEMPO ESGOTADO!';
        document.getElementById('start-btn').innerText = 'REPETIR';
      }
    }
  }, 1000);
}

// Controles D-PAD y Botón
function bindBtn(id, key) {
  const el = document.getElementById(id);
  const setKey = (val) => (e) => { e.preventDefault(); keys[key] = val; };
  el.addEventListener('touchstart', setKey(true));
  el.addEventListener('touchend', setKey(false));
  el.addEventListener('mousedown', setKey(true));
  el.addEventListener('mouseup', setKey(false));
}

bindBtn('btn-up', 'up');
bindBtn('btn-down', 'down');
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');

document.getElementById('b-absorb').addEventListener('click', () => {
  if (sander.hasPotion) {
    sander.freezeTimer = 220; // Congela al boss temporalmente
  }
});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('btn-pause').addEventListener('click', () => {
  gameState = gameState === 'playing' ? 'paused' : 'playing';
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') keys.up = true;
  if (e.key === 'ArrowDown') keys.down = true;
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.code === 'Space') document.getElementById('b-absorb').click();
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowUp') keys.up = false;
  if (e.key === 'ArrowDown') keys.down = false;
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
});

gameLoop();
</script>
</body>
</html>
